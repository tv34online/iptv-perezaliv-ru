name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - ".github/workflows/update-playlist.yml"
      - "scripts/filter_playlist.py"

permissions:
  contents: write

concurrency:
  group: update-iptv-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source playlist
        run: |
          curl -fLsS --retry 3 \
            "https://raw.githubusercontent.com/Dimonovich/TV/Dimonovich/FREE/TV" \
            -o source.m3u

      - name: Filter playlist
        run: |
          python3 scripts/filter_playlist.py source.m3u playlist.m3u

      - name: Check output
        run: |
          test -s playlist.m3u
          grep -q '^#EXTM3U' playlist.m3u

      - name: Publish playlist
        run: |
          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "Playlist has not changed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update filtered IPTV playlist"
          git push
